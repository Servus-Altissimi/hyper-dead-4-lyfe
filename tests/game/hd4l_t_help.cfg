echo "=== HD4L test cfgs (exec <name>) ==="
echo "hd4l_t_kit          god, infinite ammo, every throwable and heal item"
echo "hd4l_t_parts        which parts registered, escalation state"
echo "hd4l_t_flash        bile flash vs witch, hunter, charger, smoker, tank, mob"
echo "hd4l_t_flash_witch  two witches in front of you: throw the jar, they must not wake"
echo "hd4l_t_flash_tank   a tank and a jar: it should reel, crawl and not swing"
echo "hd4l_t_flash_mob    a horde and a jar: commons stagger on the spot"
echo "hd4l_t_stunned      prints what the flash has stunned and how"
echo "hd4l_t_laststand    kills the bots: Last Stand, heartbeat, director readout"
echo "hd4l_t_heartbeat    Last Stand at 30 health: the fast, loud heartbeat"
echo "hd4l_t_ls_director  Last Stand director numbers (pinners 1, small hordes)"
echo "hd4l_t_ls_tank      Last Stand with a tank: tanks still come"
echo "hd4l_t_hitslow      horde plus a readout of the hit slowdown"
echo "hd4l_t_warp         bots frozen and stranded: they must warp onto your trail"
echo "hd4l_t_warp_gap     frozen bots; jump a gap or ledge, bots must not land in it"
echo "hd4l_t_warp_fire    molotov under you, then strand: bots must not warp into fire"
echo "hd4l_t_trail        prints your safe trail and the current warp spot"
echo "hd4l_t_bots_go      unfreezes bots after the warp tests"
echo "hd4l_t_bots_arm     every bot: rifle, magnum, medkit, molotov, adrenaline, ammo"
echo "hd4l_t_bots_shotgun / _sniper / _smg / _m60 / _ak   same with that gun"
echo "hd4l_t_tank         a plain tank and its readout"
echo "hd4l_t_tank_amp     an amped tank (red eyes, 1.5x hp, faster, angrier)"
echo "hd4l_t_tanks        tank health, speed and amp readout"
echo "hd4l_t_tank_now     forces the chapter tank on the next escalation tick"
echo "hd4l_t_finale       loads c1m4_atrium (finale) in hd4l"
echo "hd4l_t_finale2      loads c2m5_concert (finale) in hd4l"
echo "hd4l_t_finale_start starts the finale: its tanks come amped and alone"
echo "hd4l_t_credits      wins the finale on the spot: outro with the HD4L title"
echo "hd4l_t_hyper        you in HYPER for 30 s: Merciless director"
echo "hd4l_t_specials     one of every special"
echo "hd4l_t_horde        three mobs"
echo "hd4l_t_horde_here   30 commons around you, spawned directly (no director needed)"
echo "hd4l_t_horde_big    80 commons around you"
echo "hd4l_t_navgen       generates a nav mesh for this map (needed for hordes on tumtara_empty)"
echo "hd4l_t_clear        kills every infected"
echo "hd4l_t_heal         heals every survivor"
echo "hd4l_t_hurt         you to 30 health"
echo "hd4l_t_director     director debug overlay on"
echo "hd4l_t_quiet        stops the director spawning (director_stop)"
echo "hd4l_t_loud         director back on"
echo "hd4l_t_hidehud      plain coop: holds each hide-HUD bit 4 s, shows which panel each hides"
echo "hd4l_t_proj         projectile counters (fired, rays, held, landed, fresh, missed)"
echo "hd4l_t_proj_on      projectile debug: a line per shot and hit, rays drawn (yellow ray, green landed, blue fresh, red missed)"
echo "hd4l_t_proj_off     projectile debug off"
echo "hd4l_t_proj_slow    quarter speed to watch them fly (hd4l_t_proj_fast to undo)"
echo "hd4l_t_proj_<speed>  1000 1500 2000 3000 4000 6000 8000 12000: projectile speed live; hd4l_t_proj_stock: stock hitscan"
echo "hd4l_t_fortmode_map loads c8m5_rooftop in Fort, its own mode (hd4lfort): stock but for the lives, weapon buffs and HUD"
echo "hd4l_t_freebuild_map loads c8m5_rooftop in Fort freebuild (hd4lfreebuild): Fort with endless scrap"
echo "hd4l_t_fort_map     loads c8m5_rooftop in Fort (hd4lsurvival): prep until the survival button"
echo "hd4l_t_fort_flat    loads tumtara_empty in Fort: free building, no survival button (hd4l_t_fort_next starts wave 1)"
echo "hd4l_t_fort         Fort readout: phase, wave, time left, scrap, pieces, supplies, loot"
echo "hd4l_t_fort_scrap   +500 team scrap"
echo "hd4l_t_fort_props   a sedan, a dumpster, two trash cans to salvage (scrap in the console)"
echo "hd4l_t_fort_items   a rifle, a medkit, pills: they turn into junk props to salvage"
echo "hd4l_t_fort_next    next phase: prep/break to a wave, a wave to its break"
echo "hd4l_t_fort_skip    the current wave or break ends in 3 s"
echo "hd4l_t_fort_wave4   straight to wave 4 (a tank due)"
echo "hd4l_t_fort_siege   wave on plus 40 commons against your pieces"
echo "hd4l_t_fort_tank    wave on plus a Fort tank"
